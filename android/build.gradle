buildscript {
  ext.VisionCameraFaceDetection = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return VisionCameraFaceDetection[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply from: '../nitrogen/generated/android/visioncamerafacedetection+autolinking.gradle'

apply plugin: "com.facebook.react"

react {
  // Keep codegen limited to this library to avoid generating duplicate delegates from example/node_modules.
  jsRootDir = file("../src")
}

android {
  namespace "com.margelo.nitro.visioncamerafacedetection"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    resources {
      excludes += [
      "META-INF",
        "META-INF/**"
      ]
    }

    jniLibs {
      excludes += [
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libhermes.so",
      "**/libhermes-executor-debug.so",
      "**/libhermes_executor.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
      "**/libturbomodulejsijni.so",
      "**/libreact_nativemodule_core.so",
      "**/libjscexecutor.so"
    ]
    }
  }

  buildFeatures {
    prefab true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  // Host app provides React Native runtime.
  compileOnly "com.facebook.react:react-android"
  // Add minimal dependency on CameraX to use ImageAnalysis
  implementation "androidx.camera:camera-core:1.7.0-alpha01"
  // Google MLKit library
  implementation "com.google.mlkit:face-detection:16.1.7"
  // Add a dependency on NitroModules
  compileOnly project(":react-native-nitro-modules")
  // Add a dependency on VisionCamera (for HybridFrameSpec and HybridCameraOutputSpec)
  compileOnly project(":react-native-vision-camera")
  // Add a dependency Tensorflow Lite
  implementation 'com.google.ai.edge.litert:litert:1.4.1'
  implementation 'com.google.ai.edge.litert:litert-support:1.4.1'
}
